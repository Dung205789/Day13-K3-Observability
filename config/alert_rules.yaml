alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 2000 for 5m
    type: symptom-based
    owner: dung.ngo
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: dung.ngo
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_budget_exceeded
    severity: warning
    condition: daily_cost_usd > 2.5 for 1h
    type: symptom-based
    owner: dung.ngo
    runbook: docs/alerts.md#alert-3
