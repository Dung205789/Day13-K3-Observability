alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95(latency_ms) > 3000ms over 5m"
    type: symptom-based
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% over 5m"
    type: symptom-based
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeOrExceeded
    severity: warning
    condition: "total_cost_usd > 2.5 over 1h"
    type: symptom-based
    owner: finops-team
    runbook: docs/alerts.md#alert-3
