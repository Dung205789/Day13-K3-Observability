alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: SRE-Team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2.0 for 3m
    type: symptom-based
    owner: Backend-Team
    runbook: docs/alerts.md#alert-2
  - name: DailyCostSpike
    severity: warning
    condition: daily_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: FinOps-Team
    runbook: docs/alerts.md#alert-3
